name: CI - BiotaScrow QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🌐 Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Ejecutar pruebas automatizadas
        run: npm run test:e2e

      # (Opcional) Guarda los reportes de error de Playwright si algo falla
      - name: 📁 Subir reporte de pruebas (Solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
